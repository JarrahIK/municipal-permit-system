name: CI/CD

# Runs on every push to main/develop, on version tags (v1.0.0), and on pull requests.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  # 1) CI: does it build, and do the tests pass?
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MunicipalPermitSystem.sln

      - name: Build
        run: dotnet build MunicipalPermitSystem.sln --no-restore -c Release

      - name: Test
        run: dotnet test MunicipalPermitSystem.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  # 2) CD: build the Docker image; publish it to GitHub Container Registry
  #    (only for pushes to main / develop / version tags — pull requests just prove it builds).
  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets the built-in GITHUB_TOKEN push to ghcr.io — no secrets to set up
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decides the image name + tags:
      #   push to develop -> :develop      push to main -> :main and :latest
      #   tag v1.2.3      -> :1.2.3        every push   -> :sha-<commit>
      - name: Work out image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
